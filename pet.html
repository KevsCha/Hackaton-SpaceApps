<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/agente-page.css">
    <title>Agente-Page</title>
    <style>
         video {
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
        }
      
    </style>
</head>

<body>
    <header>
        <a class="back" href="./index.html" aria-label="Back to home"><svg width="18" height="18" viewBox="0 0 18 18"
                aria-hidden="true">
                <path d="M11 3 L5 9 L11 15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>Home</a>
        <div class="header-logo">
            <img src="./src/img/img_medico.png" alt="Logo del agente">
        </div>
        <div class="agente-info">
            <h1>DRA. EVA SPACE</h1>
            <span>Medeical Consultation</span>
            <span>Unit: PSYCH-MED AI V4.2</span>
        </div>
        <div class="info-connexion">
            <p>Active Session</p>
            <span>00:14:52</span>
            <span>ELAPSED</span>
        </div>
        <div class="container-setting">
            <img src="../img/icon-settings.png" alt="icono de opciones">
        </div>
    </header>
    <main>
        <div class="container-main">
            <div class="container-agente">
                <span>AI NEURAL LINK ACTIVE</span>

                <video src="./src/img/perro.mp4" aria-label="Agente de IA" autoplay muted loop playsinline>
                    Your browser does not support the video tag.
                </video>
                <!-- <video src=""></video> -->
                <img class="icon-ondas" src="./src/img/icon-ondas.png" alt="icon de ondas">
                <p>Gau gau</p>
            </div>
            <div class="container-inputs">
                <div class="icono">
                    <img src="./src/img/icon-microfono.png" alt="icono de microfono">
                </div>
                <div class="icono">
                    <img src="./src/img/icon-clip.png" alt="icono para adjuntar archivos">
                </div>
                <div class="input-bar">
                    <input type="text" placeholder="Inquire about health metrics or request medical advice...">
                </div>
                <div class="container btn">
                    <button>TRANSMIT</button>
                </div>
            </div>
        </div>
        <article class="container-infoMedico">
            <div class="card-top">
                <div class="title">
                    Pet
                    <img src="./src/img/icon-file.png" alt="icono-file">
                </div>
                <div class="body-interactive">
                    <h2></h2>
                    <img src="https://cdn-icons-png.flaticon.com/128/91/91536.png" alt="cuerpo humano">
                </div>
                <!-- <div class="info-diagnostico">
                    <h2>Primari Diagnosis</h2>
                    <p>Acute Circadian
                        Disruption due to
                        radiation storm
                        sequence in Sector 7-G.
                        Recommend 4mg Melatonin
                        equivalent.</p>
                </div> -->
            </div>
            <div class="card-bottom">
                <div class="history">
                    <div>
                        <img src="./src/img/icon-history.png" alt="icono historial">
                        <p>Yesterday: Post-EVA debriefing</p>
                    </div>
                    <div>
                        <img src="./src/img/icon-history.png" alt="icono historial">
                        <p>48h Ago: Nutrition adjustment</p>
                    </div>
                </div>
            </div>
        </article>
    </main>

</body>

</html>
